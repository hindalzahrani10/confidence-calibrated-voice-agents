# Default configuration for the when-to-clarify voice agent testbed.
# Everything the experiments depend on lives here, so a run is reproducible
# from this file plus a seed. Copy it to configs/my_run.yaml and edit.

seed: 1234

paths:
  data_dir: data
  audio_dir: data/audio
  labels: data/labels.jsonl
  splits_dir: data/splits
  results_dir: results
  prompts_dir: prompts

asr:
  # faster-whisper model size. "small" is the recommended starting point:
  # it runs on CPU in a pinch and on any consumer GPU comfortably.
  model: small
  device: auto          # auto | cpu | cuda
  compute_type: default # e.g. float16 on GPU, int8 on CPU
  language: en
  # Word timestamps are required: word-level probabilities are our ASR
  # confidence signal.
  word_timestamps: true
  beam_size: 5

llm:
  # Any open instruction-tuned 7-8B chat model works. Start small if your
  # GPU is small: Qwen2.5-1.5B-Instruct is a fine pilot model.
  model: Qwen/Qwen2.5-7B-Instruct
  device_map: auto
  dtype: bfloat16
  max_new_tokens: 96
  # Greedy answer used for scoring; the k samples below feed semantic entropy.
  temperature: 0.0
  n_samples: 5
  sample_temperature: 0.7

signals:
  # Which confidence families to extract. Turn any off to save compute
  # during a pilot; the ablation in the paper needs all five.
  asr_confidence: true
  token_logprob: true
  verbalized: true
  semantic_entropy: true
  self_interrogation: true

data:
  # Noise levels (dB SNR) used to build controlled acoustic variants.
  # null means the clean original.
  snr_levels: [null, 20, 10, 5]
  ambiguity_types: [none, acoustic, intent, underspecified]
  target_size: 400
  val_fraction: 0.3   # thresholds are tuned here, never on test

policies:
  # Thresholds are placeholders: scripts/tune_thresholds.py overwrites them
  # using the validation split only.
  active:
    - never_clarify
    - always_clarify
    - asr_threshold
    - logprob_threshold
    - verbalized_threshold
    - entropy_threshold
    - self_interrogation
    - calibrated_fusion
  thresholds:
    asr_threshold: 0.75
    logprob_threshold: -0.55
    verbalized_threshold: 70.0
    entropy_threshold: 0.90

eval:
  n_bootstrap: 1000
  ece_bins: 15
